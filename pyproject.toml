[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pgvector"
version = "0.1.0"
description = "RAG with LangChain, Hugging Face, and pgvector"
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_pgvector*"]
